<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png?v=4" />
    <link rel="shortcut icon" href="./icon.ico?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Hệ thống Tiếp nhận và Quản lý hồ sơ - Chi nhánh Hớn Quản</title>
    <!-- ReactCrop CSS -->
    <link rel="stylesheet" href="https://unpkg.com/react-image-crop/dist/ReactCrop.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #0f172a; /* MÀU TỐI ĐỂ KHỚP VỚI MÀN HÌNH LOGIN */
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      @media print {
        @page {
          margin: 10mm;
          size: auto;
        }
      }
      /* Màn hình load đồng bộ ảnh nền sân bay của trang Đăng nhập */
      #initial-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-image: url('./bg-airport.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 9999;
        transition: opacity 0.5s;
      }
      /* Lớp phủ tối mờ bảo đảm tương phản chữ và logo */
      #initial-loader::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(15, 23, 42, 0.7); /* Lớp phủ sẫm màu giống login */
        z-index: -1;
      }
      /* Loading Animation cho Icon chi nhánh */
      .branch-icon {
        width: 80px;
        height: 80px;
        object-fit: contain;
        animation: pulse-glow 2s infinite ease-in-out;
        margin-bottom: 20px;
        filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.25));
      }
      @keyframes pulse-glow {
        0% {
          transform: scale(0.92);
          filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.7));
        }
        100% {
          transform: scale(0.92);
          filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }
      }
    </style>
    <script>
      // --- POLYFILL CƠ BẢN CHO MÔI TRƯỜNG WEB ---
      if (typeof window.global === 'undefined') window.global = window;
      
      if (typeof window.process === 'undefined') {
        window.process = { 
          env: { 
            NODE_ENV: 'production',
            API_KEY: '' 
          },
          nextTick: function(fn) { setTimeout(fn, 0); },
          browser: true,
          version: '',
          versions: { node: '' }
        };
      }
    </script>

</head>

    <div id="initial-loader">
      <img src="./icon.png" class="branch-icon" alt="Chi nhánh Hớn Quản" onerror="this.src='./Logo_Dong_Nai.ico'" />
      <div style="font-family: sans-serif; color: #f1f5f9; font-weight: 700; font-size: 15px; letter-spacing: 0.05em; text-shadow: 0 2px 4px rgba(0,0,0,0.85); text-transform: uppercase;">Đang tải hệ thống...</div>
    </div>
