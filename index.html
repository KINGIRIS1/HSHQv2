
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png?v=4" />
    <link rel="shortcut icon" href="./icon.ico?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Hệ thống Tiếp nhận và Quản lý hồ sơ - Chi nhánh Hớn Quản</title>
    <!-- ReactCrop CSS -->
    <link rel="stylesheet" href="https://unpkg.com/react-image-crop/dist/ReactCrop.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #0f172a; /* MÀU TỐI ĐỂ KHỚP VỚI MÀN HÌNH LOGIN */
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      @media print {
        @page {
          margin: 10mm;
          size: auto;
        }
      }
      /* Loading Screen ban đầu */
      #initial-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: url('./bg-airport.jpg') no-repeat center center / cover;
        z-index: 9999;
        transition: opacity 0.5s ease-out, visibility 0.5s;
        padding: 16px;
        box-sizing: border-box;
      }
      #initial-loader::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(15, 23, 42, 0.25);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 0;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 32px 28px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        max-width: 360px;
        width: 100%;
        text-align: center;
        box-sizing: border-box;
      }
      .logo-wrapper {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        margin-top: 4px;
        flex-shrink: 0;
      }
      .logo-img {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
        animation: pulseLogo 2.5s ease-in-out infinite;
        position: relative;
        z-index: 2;
        background: #ffffff;
        padding: 2px;
      }
      .spinner-ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #0284c7;
        border-right-color: #2563eb;
        animation: spin 1.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        z-index: 1;
      }
      .spinner-ring-outer {
        position: absolute;
        top: -6px;
        left: -6px;
        width: calc(100% + 12px);
        height: calc(100% + 12px);
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.6);
        animation: spinReverse 12s linear infinite;
      }
      .loader-title {
        color: #0f172a;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 8px;
        text-align: center;
        line-height: 1.35;
        text-shadow: 0 0 10px #ffffff, 0 0 16px #ffffff, 0 1px 3px rgba(255,255,255,0.95);
        word-break: break-word;
      }
      .loader-subtitle {
        color: #1e293b;
        font-size: 13px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        line-height: 1.35;
        text-shadow: 0 0 8px #ffffff, 0 0 12px #ffffff, 0 1px 2px rgba(255,255,255,0.95);
      }
      @media (max-width: 480px) {
        .loader-content {
          padding: 24px 20px;
          border-radius: 20px;
          max-width: 300px;
        }
        .logo-wrapper {
          width: 84px;
          height: 84px;
          margin-bottom: 16px;
        }
        .logo-img {
          width: 66px;
          height: 66px;
        }
        .loader-title {
          font-size: 15px;
          margin-bottom: 6px;
        }
        .loader-subtitle {
          font-size: 12px;
        }
      }
      .dot-pulse {
        display: inline-block;
        animation: dots 1.5s infinite steps(4, end);
        width: 18px;
        text-align: left;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 22px rgba(59, 130, 246, 0.7)); }
      }
      @keyframes dots {
        0%, 20% { content: ""; }
        40% { content: "."; }
        60% { content: ".."; }
        80%, 100% { content: "..."; }
      }
    </style>
    <script>

        };
      }
    </script>

</head>
  <body>
    <div id="initial-loader">
      <div class="loader-content">
        <div class="logo-wrapper">
          <div class="spinner-ring-outer"></div>
          <div class="spinner-ring"></div>
          <img src="./icon.png?v=4" alt="Logo" class="logo-img" />
        </div>
        <div class="loader-title">Hệ Thống Quản Lý Hồ Sơ</div>
        <div class="loader-subtitle">
          <span>Đang khởi tạo hệ thống</span>
          <span class="dot-pulse">...</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
